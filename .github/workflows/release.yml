name: Build and publish macOS release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build universal app
        run: APP_VERSION="${GITHUB_REF_NAME#v}" ./build-app.sh

      - name: Publish beta release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "dist/WineShelf-$version-universal.zip" \
            --title "WineShelf $version" \
            --notes-file .github/release-notes.md \
            --prerelease
